[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "climbing-performance"
version = "0.1.0"
description = "Framework for estimating climbing performance metrics in cycling"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "httpx",
    "numpy",
    "pandas",
    "requests",
    "tzdata",
    "uvicorn",
]
[tool.setuptools]
packages = ["climbing_performance"]
