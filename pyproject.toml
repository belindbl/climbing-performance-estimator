[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "climbing-performance"
version = "0.1.0"
description = "Local GPX pipeline for estimating and comparing cycling climb performance"
readme = "readme.md"
requires-python = ">=3.12"
dependencies = [
    "numpy",
    "pandas",
    "python-dotenv",
    "rasterio",
    "requests",
    "tzdata",
]

[project.scripts]
cl-perf = "climbing_performance.cli:main"

[dependency-groups]
dev = ["pytest"]

[tool.setuptools]
packages = ["climbing_performance"]
