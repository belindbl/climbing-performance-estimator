<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Climbing Segment Model</title>
  <style>
    :root {
      --bg: #0f1214;
      --panel: #171b1f;
      --chart-bg-top: #151a20;
      --chart-bg-bottom: #101417;
      --ink: #e7ece9;
      --form-ink: #182235;
      --muted: #9aa7a0;
      --line: #2a3230;
      --protected: #4f8f72;
      --low: #d1a23b;
      --solo: #b85d4d;
      --focus: #245fce;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      letter-spacing: 0;
    }

    main {
      width: min(1380px, calc(100vw - 32px));
      margin: 24px auto;
      display: grid;
      grid-template-columns: minmax(0, 1fr) 360px;
      gap: 16px;
    }

    .workspace,
    .sidebar {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
      box-shadow: 0 1px 2px rgba(24, 32, 29, 0.05);
    }

    .workspace {
      min-width: 0;
      overflow: hidden;
    }

    .toolbar,
    .sidebar-section {
      padding: 14px 16px;
      border-bottom: 1px solid var(--line);
    }

    .toolbar {
      display: grid;
      grid-template-columns: 1fr auto auto;
      gap: 12px;
      align-items: center;
    }

    h1,
    h2 {
      margin: 0;
      font-size: 16px;
      line-height: 1.25;
      font-weight: 700;
    }

    h2 {
      font-size: 13px;
      color: var(--muted);
      text-transform: uppercase;
    }

    .subtle {
      margin-top: 4px;
      color: var(--muted);
      font-size: 13px;
    }

    button,
    select,
    input {
      font: inherit;
    }

    button {
      height: 34px;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: #fff;
      color: var(--form-ink);
      cursor: pointer;
      padding: 0 11px;
      white-space: nowrap;
      font-size: 15px;
    }

    button:hover {
      border-color: #aeb8b1;
    }

    button.primary {
      background: var(--ink);
      border-color: var(--ink);
      color: #0c0808;
    }

    .file-control {
      height: 34px;
      display: inline-grid;
      align-items: center;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: #fff;
      color: var(--form-ink);
      cursor: pointer;
      padding: 0 11px;
      white-space: nowrap;
      font-size: 15px;
    }

    .file-control input {
      display: none;
    }

    .chart-wrap {
      padding: 16px;
    }

    svg {
      width: 100%;
      height: auto;
      display: block;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: linear-gradient(180deg, var(--chart-bg-top) 0%, var(--chart-bg-bottom) 100%);
      user-select: none;
      touch-action: none;
    }

    .segment-band {
      opacity: 0.2;
    }

    .segment-label {
      font-size: 12px;
      fill: var(--ink);
      pointer-events: none;
    }

    .handle {
      cursor: ew-resize;
      stroke: #fff;
      stroke-width: 3;
    }

    .handle-hit {
      cursor: ew-resize;
      fill: transparent;
    }

    .axis {
      stroke: #6f7f99;
      stroke-width: 1;
    }

    .grid {
      stroke: #25344f;
      stroke-width: 1;
    }

    .profile {
      fill: rgba(40, 70, 58, 0.13);
      stroke: #c3ccd8;
      stroke-width: 2;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 10px;
      padding: 0 16px 16px;
    }

    .stat {
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 10px;
      min-height: 72px;
    }

    .stat span {
      display: block;
      color: var(--muted);
      font-size: 12px;
    }

    .stat strong {
      display: block;
      margin-top: 6px;
      font-size: 22px;
      line-height: 1.1;
    }

    .segment-list {
      display: grid;
      gap: 8px;
      padding: 12px 16px 16px;
    }

    .segment-row {
      display: grid;
      grid-template-columns: 10px minmax(0, 1fr);
      gap: 8px;
      align-items: center;
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 8px;
    }

    .swatch {
      width: 10px;
      height: 48px;
      border-radius: 3px;
    }

    .segment-row select {
      height: 32px;
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 0 8px;
      background: #fff;
      min-width: 0;
      width: 100%;
      color: var(--form-ink);
    }

    .segment-actions {
      grid-column: 2;
      display: grid;
      grid-template-columns: minmax(0, 1fr) 48px;
      gap: 8px;
    }

    .segment-actions button {
      width: 48px;
      padding: 0;
      font-size: 12px;
    }

    .segment-meta {
      min-width: 0;
    }

    .segment-meta strong {
      display: block;
      font-size: 13px;
    }

    .segment-meta span {
      display: block;
      color: var(--muted);
      font-size: 12px;
      margin-top: 2px;
    }

    .inputs {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      padding: 12px 16px 16px;
    }

    label {
      display: grid;
      gap: 4px;
      font-size: 12px;
      color: var(--muted);
    }

    input {
      height: 34px;
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 0 8px;
      color: var(--form-ink);
      background: #fff;
      min-width: 0;
    }

    input::placeholder {
      color: var(--muted);
      opacity: 1;
    }

    input:-webkit-autofill,
    input:-webkit-autofill:hover,
    input:-webkit-autofill:focus {
      -webkit-text-fill-color: var(--form-ink);
      box-shadow: 0 0 0 1000px #fff inset;
    }

    .error {
      padding: 12px 16px;
      color: #8b2424;
      background: #fff2f2;
      border-bottom: 1px solid #f0cdcd;
      display: none;
    }

    details.advanced {
      border-top: 1px solid var(--line);
    }

    details.advanced summary {
      cursor: pointer;
      padding: 14px 16px;
      color: var(--muted);
      font-size: 13px;
      font-weight: 700;
      text-transform: uppercase;
      border-bottom: 1px solid var(--line);
      list-style: none;
    }

    details.advanced summary::-webkit-details-marker {
      display: none;
    }

    .advanced-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      padding: 12px 16px;
    }

    .readout,
    .breakdown-row {
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 8px;
      min-width: 0;
    }

    .readout span {
      display: block;
      color: var(--muted);
      font-size: 11px;
    }

    .readout strong {
      display: block;
      margin-top: 4px;
      font-size: 15px;
      line-height: 1.2;
      overflow-wrap: anywhere;
    }

    .segment-breakdown {
      display: grid;
      gap: 8px;
      padding: 0 16px 16px;
    }

    .breakdown-row strong {
      display: block;
      font-size: 13px;
      margin-bottom: 6px;
    }

    .breakdown-metrics {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 6px;
      color: var(--muted);
      font-size: 12px;
    }

    @media (max-width: 980px) {
      main {
        grid-template-columns: 1fr;
      }

      .stats {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
    }
  </style>
</head>
<body>
  <main>
    <section class="workspace">
      <div class="toolbar">
        <div>
          <h1 id="routeTitle">Climbing Segment Model</h1>
          <div class="subtle" id="routeSummary">Loading GPX route</div>
        </div>
        <label class="file-control">
          GPX File
          <input id="gpxFile" type="file" accept=".gpx,application/gpx+xml,application/xml,text/xml">
        </label>
        <button class="primary" id="addBreakpoint">Add Breakpoint</button>
      </div>
      <div class="error" id="errorBox"></div>
      <div class="chart-wrap">
        <svg id="profile" viewBox="0 0 980 440" role="img" aria-label="Elevation profile with editable segment breakpoints"></svg>
      </div>
      <div class="stats">
        <div class="stat"><span>W/kg</span><strong id="wkg">--</strong></div>
        <div class="stat"><span>Total Power</span><strong id="power">--</strong></div>
        <div class="stat"><span>Aero Power</span><strong id="aero">--</strong></div>
        <div class="stat"><span>Ground Speed</span><strong id="groundSpeed">--</strong></div>
      </div>
    </section>

    <aside class="sidebar">
      <div class="sidebar-section">
        <h2>Assumptions</h2>
      </div>
      <div class="inputs">
        <label>Rider weight (kg)<input id="riderMass" type="number" min="1" step="0.1" value="60"></label>
        <label>Bike weight (kg)<input id="bikeMass" type="number" min="1" step="0.1" value="8"></label>
        <label>CdA (m2)<input id="cda" type="number" min="0" step="0.01" value="0.37"></label>
        <label>Crr<input id="crr" type="number" min="0" step="0.0005" value="0.004"></label>
        <label>Temp C<input id="temperature" type="number" step="0.1" value="15.4"></label>
        <label>Wind deg<input id="windDirection" type="number" min="0" max="360" step="1" value="21"></label>
      </div>
      <div class="sidebar-section">
        <h2>Segments</h2>
        <div class="subtle">Drag handles on the profile or edit segment type here.</div>
      </div>
      <div class="segment-list" id="segmentList"></div>
      <details class="advanced" open>
        <summary>Advanced</summary>
        <div class="advanced-grid">
          <div class="readout"><span>aSLP</span><strong id="aslpPower">--</strong></div>
          <div class="readout"><span>aSLP W/kg</span><strong id="aslpWkg">--</strong></div>
          <div class="readout"><span>VAM</span><strong id="vam">--</strong></div>
          <div class="readout"><span>Altitude loss</span><strong id="altitudeLoss">--</strong></div>
          <div class="readout"><span>Gravity</span><strong id="gravityPower">--</strong></div>
          <div class="readout"><span>Rolling</span><strong id="rollingPower">--</strong></div>
          <div class="readout"><span>Aero</span><strong id="advancedAeroPower">--</strong></div>
          <div class="readout"><span>Air density</span><strong id="airDensity">--</strong></div>
          <div class="readout"><span>Temp</span><strong id="tempReadout">--</strong></div>
          <div class="readout"><span>Wind direction</span><strong id="windDirectionReadout">--</strong></div>
        </div>
        <div class="segment-breakdown" id="segmentBreakdown"></div>
      </details>
    </aside>
  </main>

  <script>
    const API_BASE_CANDIDATES = [
      window.location.origin,
      "http://127.0.0.1:8765",
      "http://127.0.0.1:8766"
    ].filter((value, index, values) => value.startsWith("http") && values.indexOf(value) === index);

    const ROUTE_API = "/api/routes/la-redoute";
    const PERFORMANCE_API = "/api/performance";
    const DEFAULT_WIND_EXPOSURE_FACTOR = 1.0;

    const protectionTypes = {
      protected: { label: "Protected", aeroMultiplier: 0.65, color: "#4f8f72" },
      low: { label: "Low protection", aeroMultiplier: 0.82, color: "#d1a23b" },
      solo: { label: "Solo", aeroMultiplier: 1.0, color: "#b85d4d" }
    };

    const state = {
      route: null,
      segments: [
        { start: 0, end: 0, type: "protected" },
      ],
      draggingHandle: null,
      resultRequestId: 0,
      gpxText: null,
      weatherManuallyEdited: false
    };

    const els = {
      svg: document.getElementById("profile"),
      routeTitle: document.getElementById("routeTitle"),
      routeSummary: document.getElementById("routeSummary"),
      errorBox: document.getElementById("errorBox"),
      segmentList: document.getElementById("segmentList"),
      addBreakpoint: document.getElementById("addBreakpoint"),
      gpxFile: document.getElementById("gpxFile"),
      riderMass: document.getElementById("riderMass"),
      bikeMass: document.getElementById("bikeMass"),
      cda: document.getElementById("cda"),
      crr: document.getElementById("crr"),
      temperature: document.getElementById("temperature"),
      windDirection: document.getElementById("windDirection"),
      wkg: document.getElementById("wkg"),
      power: document.getElementById("power"),
      aero: document.getElementById("aero"),
      groundSpeed: document.getElementById("groundSpeed"),
      aslpPower: document.getElementById("aslpPower"),
      aslpWkg: document.getElementById("aslpWkg"),
      vam: document.getElementById("vam"),
      altitudeLoss: document.getElementById("altitudeLoss"),
      gravityPower: document.getElementById("gravityPower"),
      rollingPower: document.getElementById("rollingPower"),
      advancedAeroPower: document.getElementById("advancedAeroPower"),
      airDensity: document.getElementById("airDensity"),
      tempReadout: document.getElementById("tempReadout"),
      windDirectionReadout: document.getElementById("windDirectionReadout"),
      segmentBreakdown: document.getElementById("segmentBreakdown")
    };

    init();

    async function init() {
      try {
        const payload = await apiFetch(ROUTE_API).then(response => {
          if (!response.ok) throw new Error(`Could not load ${ROUTE_API}`);
          return response.json();
        });
        loadRoute(payload);
        wireEvents();
        render();
      } catch (error) {
        showError(error.message);
      }
    }

    function wireEvents() {
      [
        els.riderMass,
        els.bikeMass,
        els.cda,
        els.crr
      ]
        .forEach(input => input.addEventListener("input", render));

      [els.temperature, els.windDirection]
        .forEach(input => input.addEventListener("input", () => {
          state.weatherManuallyEdited = true;
          render();
        }));

      els.addBreakpoint.addEventListener("click", () => {
        if (!state.route) return;
        const longestIndex = state.segments
          .map((segment, index) => ({ index, length: segment.end - segment.start }))
          .sort((a, b) => b.length - a.length)[0].index;
        const segment = state.segments[longestIndex];
        const split = segment.start + (segment.end - segment.start) / 2;
        state.segments.splice(
          longestIndex,
          1,
          { start: segment.start, end: split, type: segment.type },
          { start: split, end: segment.end, type: segment.type }
        );
        render();
      });

      els.gpxFile.addEventListener("change", async () => {
        const file = els.gpxFile.files[0];
        if (!file) return;

        try {
          state.gpxText = await file.text();
          state.weatherManuallyEdited = false;
          const result = await requestPerformanceWithWeatherFallback({ segments: [] });
          loadRoute(result);
          syncWeatherInputs(result.summary);
          render();
        } catch (error) {
          showError(error.message);
        }
      });

      window.addEventListener("pointermove", event => {
        if (state.draggingHandle === null || !state.route) return;
        const distance = xToDistance(event.clientX);
        moveBreakpoint(state.draggingHandle, distance);
        render();
      });

      window.addEventListener("pointerup", () => {
        state.draggingHandle = null;
      });
    }

    function render() {
      if (!state.route) return;
      normalizeSegments();
      renderChart();
      renderSegmentList();
      renderResults();
    }

    function normalizeSegments() {
      state.segments.sort((a, b) => a.start - b.start);
      state.segments[0].start = 0;
      state.segments[state.segments.length - 1].end = state.route.distanceM;
      for (let i = 0; i < state.segments.length - 1; i += 1) {
        const boundary = clamp(state.segments[i].end, state.segments[i].start + 10, state.segments[i + 1].end - 10);
        state.segments[i].end = boundary;
        state.segments[i + 1].start = boundary;
      }
    }

    function renderChart() {
      const width = 980;
      const height = 440;
      const pad = { left: 54, right: 20, top: 28, bottom: 46 };
      const plotW = width - pad.left - pad.right;
      const plotH = height - pad.top - pad.bottom;
      const route = state.route;

      els.svg.innerHTML = "";
      const ns = "http://www.w3.org/2000/svg";
      const x = distance => pad.left + (distance / route.distanceM) * plotW;
      const y = ele => pad.top + (1 - (ele - route.minElevationM) / (route.maxElevationM - route.minElevationM)) * plotH;

      for (let i = 0; i <= 4; i += 1) {
        const yy = pad.top + (plotH / 4) * i;
        addLine(ns, yy, yy, pad.left, width - pad.right, "grid");
      }

      for (const segment of state.segments) {
        const info = protectionTypes[segment.type];
        const rect = document.createElementNS(ns, "rect");
        rect.setAttribute("class", "segment-band");
        rect.setAttribute("x", x(segment.start));
        rect.setAttribute("y", pad.top);
        rect.setAttribute("width", Math.max(1, x(segment.end) - x(segment.start)));
        rect.setAttribute("height", plotH);
        rect.setAttribute("fill", info.color);
        els.svg.appendChild(rect);

        const label = document.createElementNS(ns, "text");
        label.setAttribute("class", "segment-label");
        label.setAttribute("x", x(segment.start) + 8);
        label.setAttribute("y", pad.top + 20);
        label.textContent = info.label;
        els.svg.appendChild(label);
      }

      const points = route.points.filter(point => point.ele !== null);
      const path = points.map((point, index) => `${index === 0 ? "M" : "L"} ${x(point.distance).toFixed(2)} ${y(point.ele).toFixed(2)}`).join(" ");
      const area = `${path} L ${x(route.distanceM).toFixed(2)} ${height - pad.bottom} L ${pad.left} ${height - pad.bottom} Z`;
      const profile = document.createElementNS(ns, "path");
      profile.setAttribute("class", "profile");
      profile.setAttribute("d", area);
      els.svg.appendChild(profile);

      addLine(ns, height - pad.bottom, height - pad.bottom, pad.left, width - pad.right, "axis");
      addLine(ns, pad.top, height - pad.bottom, pad.left, pad.left, "axis");

      for (let i = 1; i < state.segments.length; i += 1) {
        const handleX = x(state.segments[i].start);
        const hit = document.createElementNS(ns, "rect");
        hit.setAttribute("class", "handle-hit");
        hit.setAttribute("x", handleX - 14);
        hit.setAttribute("y", pad.top);
        hit.setAttribute("width", 28);
        hit.setAttribute("height", plotH);
        hit.addEventListener("pointerdown", event => {
          state.draggingHandle = i;
          event.preventDefault();
        });
        els.svg.appendChild(hit);

        const line = document.createElementNS(ns, "line");
        line.setAttribute("class", "handle");
        line.setAttribute("x1", handleX);
        line.setAttribute("x2", handleX);
        line.setAttribute("y1", pad.top);
        line.setAttribute("y2", height - pad.bottom);
        line.setAttribute("stroke", protectionTypes[state.segments[i].type].color);
        els.svg.appendChild(line);
      }

      addText(ns, pad.left, height - 16, "0 km");
      addText(ns, width - pad.right - 52, height - 16, `${(route.distanceM / 1000).toFixed(2)} km`);
      addText(ns, 10, pad.top + 4, `${route.maxElevationM.toFixed(0)} m`);
      addText(ns, 10, height - pad.bottom, `${route.minElevationM.toFixed(0)} m`);

      function addText(ns, tx, ty, text) {
        const node = document.createElementNS(ns, "text");
        node.setAttribute("x", tx);
        node.setAttribute("y", ty);
        node.setAttribute("font-size", "12");
        node.setAttribute("fill", "#66716a");
        node.textContent = text;
        els.svg.appendChild(node);
      }

      function addLine(ns, y1, y2, x1, x2, className) {
        const line = document.createElementNS(ns, "line");
        line.setAttribute("class", className);
        line.setAttribute("x1", x1);
        line.setAttribute("x2", x2);
        line.setAttribute("y1", y1);
        line.setAttribute("y2", y2);
        els.svg.appendChild(line);
      }
    }

    function renderSegmentList() {
      els.segmentList.innerHTML = "";
      state.segments.forEach((segment, index) => {
        const info = protectionTypes[segment.type];
        const row = document.createElement("div");
        row.className = "segment-row";

        const swatch = document.createElement("div");
        swatch.className = "swatch";
        swatch.style.background = info.color;
        row.appendChild(swatch);

        const meta = document.createElement("div");
        meta.className = "segment-meta";
        const remainingStart = state.route.distanceM - segment.start;
        const remainingEnd = state.route.distanceM - segment.end;
        meta.innerHTML = `<strong>${meters(segment.end - segment.start)}</strong><span>${meters(remainingStart)} to ${meters(remainingEnd)} remaining</span>`;
        row.appendChild(meta);

        const select = document.createElement("select");
        for (const [type, typeInfo] of Object.entries(protectionTypes)) {
          const option = document.createElement("option");
          option.value = type;
          option.textContent = typeInfo.label;
          option.selected = type === segment.type;
          select.appendChild(option);
        }
        select.addEventListener("change", () => {
          segment.type = select.value;
          render();
        });

        const actions = document.createElement("div");
        actions.className = "segment-actions";
        actions.appendChild(select);

        const remove = document.createElement("button");
        remove.textContent = "Del";
        remove.disabled = state.segments.length <= 1;
        remove.addEventListener("click", () => {
          removeSegment(index);
          render();
        });
        actions.appendChild(remove);
        row.appendChild(actions);

        els.segmentList.appendChild(row);
      });
    }

    async function renderResults() {
      const requestId = ++state.resultRequestId;
      let result;
      try {
        result = await requestPerformanceWithWeatherFallback();
      } catch (error) {
        showError(error.message);
        return;
      }
      if (requestId !== state.resultRequestId) return;
      if (!els.errorBox.textContent.includes("fallback")) {
        els.errorBox.textContent = "";
        els.errorBox.style.display = "none";
      }

      const summary = result.summary;
      syncWeatherInputs(summary);
      els.routeSummary.textContent = `${(state.route.distanceM / 1000).toFixed(2)} km, ${state.route.ascentM.toFixed(0)} m ascent, ${formatTime(state.route.durationS)}`;
      els.wkg.textContent = summary.watts_per_kg.toFixed(2);
      els.power.textContent = `${summary.total_power_w.toFixed(0)} W`;
      els.aero.textContent = `${summary.power_aero_w.toFixed(0)} W`;
      els.groundSpeed.textContent = `${summary.road_speed_km_per_h.toFixed(1)} km/h`;
      els.aslpPower.textContent = `${summary.sea_level_equivalent_power_w.toFixed(0)} W`;
      els.aslpWkg.textContent = summary.aslp_w_per_kg.toFixed(2);
      els.vam.textContent = `${summary.vam_m_per_h.toFixed(0)} m/h`;
      els.altitudeLoss.textContent = `${summary.altitude_power_loss_percent.toFixed(1)} %`;
      els.gravityPower.textContent = `${summary.power_gravity_w.toFixed(0)} W`;
      els.rollingPower.textContent = `${summary.power_rolling_w.toFixed(0)} W`;
      els.advancedAeroPower.textContent = `${summary.power_aero_w.toFixed(0)} W`;
      els.airDensity.textContent = `${summary.air_density_kg_m3.toFixed(3)} kg/m3`;
      els.tempReadout.textContent = `${readNumber(els.temperature).toFixed(1)} C`;
      els.windDirectionReadout.textContent = `${normalizeDegrees(readNumber(els.windDirection)).toFixed(0)} deg`;
      renderSegmentBreakdown(result.segments);
    }

    async function requestPerformanceWithWeatherFallback(overrides = {}) {
      try {
        return await requestPerformance(true, overrides);
      } catch (error) {
        if (error.status !== 502) throw error;

        const result = await requestPerformance(false, overrides);
        showError(`${error.message} Using still-air fallback.`);
        return result;
      }
    }

    function syncWeatherInputs(summary) {
      if (!summary) return;
      if (state.weatherManuallyEdited) return;

      const temperature = Number(summary.weather_temperature_c);
      const windDirection = Number(summary.weather_wind_direction_deg);

      if (Number.isFinite(temperature)) {
        els.temperature.value = temperature.toFixed(1);
      }
      if (Number.isFinite(windDirection)) {
        els.windDirection.value = normalizeDegrees(windDirection).toFixed(0);
      }
    }

    function routePayloadFromApi(payload) {
      const routePayload = payload && payload.route ? payload.route : payload;
      if (!routePayload || !Array.isArray(routePayload.points)) {
        throw new Error("API response did not include route points. Restart the server and hard-refresh the browser.");
      }
      return routePayload;
    }

    function routeFromApi(payload) {
      const routePayload = routePayloadFromApi(payload);
      return {
        name: routePayload.name || "GPX Route",
        points: routePayload.points.map(point => ({
          distance: point.distance_m,
          ele: point.elevation_m,
          lat: point.latitude,
          lon: point.longitude,
          time: point.time ? new Date(point.time) : null
        })),
        segments: [],
        distanceM: routePayload.distance_m,
        ascentM: routePayload.ascent_m,
        descentM: routePayload.descent_m,
        durationS: routePayload.duration_s,
        avgAltitudeM: routePayload.avg_altitude_m,
        minElevationM: routePayload.min_elevation_m,
        maxElevationM: routePayload.max_elevation_m
      };
    }

    function loadRoute(payload) {
      state.route = routeFromApi(payload);
      state.segments = [
        { start: 0, end: state.route.distanceM, type: "protected" }
      ];
      updateRouteTitle();
      els.routeSummary.textContent = `${(state.route.distanceM / 1000).toFixed(2)} km, ${state.route.ascentM.toFixed(0)} m ascent, ${formatTime(state.route.durationS)}`;
    }

    function updateRouteTitle() {
      const title = `${state.route.name} Segment Model`;
      els.routeTitle.textContent = title;
      document.title = title;
    }

    async function requestPerformance(includeWeather, overrides = {}) {
      return apiFetch(PERFORMANCE_API, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(performanceRequest(includeWeather, overrides))
      }).then(async response => {
        const payload = await response.json();
        if (!response.ok) {
          const error = new Error(payload.detail || "Performance API request failed");
          error.status = response.status;
          throw error;
        }
        return payload;
      });
    }

    function performanceRequest(includeWeather, overrides = {}) {
      return {
        rider: { mass_kg: readNumber(els.riderMass) },
        bike: {
          mass_kg: readNumber(els.bikeMass),
          cda_m2: readNumber(els.cda),
          rolling_resistance_coefficient: readNumber(els.crr)
        },
        include_weather: includeWeather,
        wind_exposure_factor: DEFAULT_WIND_EXPOSURE_FACTOR,
        gpx_text: state.gpxText,
        temperature_c: readNumber(els.temperature),
        wind_direction_deg: normalizeDegrees(readNumber(els.windDirection)),
        segments: state.segments.map((segment, index) => ({
          name: `${segment.type}-${index + 1}`,
          type: segment.type,
          start_distance_m: segment.start,
          end_distance_m: segment.end
        })),
        ...overrides
      };
    }

    async function apiFetch(path, options = {}) {
      let lastError = null;
      for (const base of API_BASE_CANDIDATES) {
        try {
          const response = await fetch(`${base}${path}`, options);
          if (![404, 405].includes(response.status)) {
            return response;
          }
          lastError = new Error(`${base}${path} returned ${response.status}`);
        } catch (error) {
          lastError = error;
        }
      }
      throw lastError || new Error(`Could not reach API path ${path}`);
    }

    function renderSegmentBreakdown(segmentStats) {
      els.segmentBreakdown.innerHTML = "";
      segmentStats.forEach(stat => {
        const type = stat.name.split("-")[0];
        const info = protectionTypes[type] || { label: stat.name };
        const row = document.createElement("div");
        row.className = "breakdown-row";
        row.innerHTML = `
          <strong>${info.label} · ${meters(stat.distance_m)}</strong>
          <div class="breakdown-metrics">
            <span>Grade ${stat.avg_gradient_percent.toFixed(1)}%</span>
            <span>VAM ${stat.vam_m_per_h.toFixed(0)}</span>
            <span>Aero ${stat.aero_power_w.toFixed(0)} W</span>
            <span>Ascent ${stat.ascent_m.toFixed(0)} m</span>
            <span>Time ${formatTime(stat.time_s)}</span>
            <span>Range ${meters(stat.start_distance_m)}-${meters(stat.end_distance_m)}</span>
          </div>
        `;
        els.segmentBreakdown.appendChild(row);
      });
    }

    function moveBreakpoint(index, distance) {
      if (index <= 0 || index >= state.segments.length) return;
      const min = state.segments[index - 1].start + 10;
      const max = state.segments[index].end - 10;
      const value = clamp(distance, min, max);
      state.segments[index - 1].end = value;
      state.segments[index].start = value;
    }

    function removeSegment(index) {
      if (state.segments.length <= 1) return;
      if (index === 0) {
        state.segments[1].start = 0;
      } else {
        state.segments[index - 1].end = state.segments[index].end;
      }
      state.segments.splice(index, 1);
    }

    function xToDistance(clientX) {
      const rect = els.svg.getBoundingClientRect();
      const x = ((clientX - rect.left) / rect.width) * 980;
      const padLeft = 54;
      const padRight = 20;
      const plotW = 980 - padLeft - padRight;
      return clamp(((x - padLeft) / plotW) * state.route.distanceM, 0, state.route.distanceM);
    }

    function normalizeDegrees(value) {
      return ((value % 360) + 360) % 360;
    }

    function readNumber(input) {
      return Number(input.value || 0);
    }

    function clamp(value, min, max) {
      return Math.max(min, Math.min(max, value));
    }

    function meters(value) {
      if (value >= 1000) return `${(value / 1000).toFixed(2)} km`;
      return `${value.toFixed(0)} m`;
    }

    function formatTime(seconds) {
      const minutes = Math.floor(seconds / 60);
      const rest = Math.round(seconds % 60).toString().padStart(2, "0");
      return `${minutes}:${rest}`;
    }

    function showError(message) {
      els.errorBox.textContent = message;
      els.errorBox.style.display = "block";
    }
  </script>
</body>
</html>
